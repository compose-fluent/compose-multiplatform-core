if (!composeWinUiJvmTargetEnabled) {
    tasks.findByName("desktopTest").configure {
        systemProperties["GOLDEN_PATH"] = project.rootDir.absolutePath + "/golden"
    }

    tasks.register("desktopHeadlessTest", Test) {
        group = "verification"
        description = "Headless desktop tests"
        testClassesDirs = sourceSets.desktopTest.output.classesDirs
        classpath = sourceSets.desktopTest.runtimeClasspath

        useJUnit {
            includeCategories("androidx.compose.ui.HeadlessTest")
        }
        systemProperty("java.awt.headless", "true")
    }

    tasks.desktopTest {
        useJUnit {
            excludeCategories("androidx.compose.ui.HeadlessTest")
        }
        jvmArgs("--add-opens=java.desktop/javax.swing=ALL-UNNAMED")
    }
}
