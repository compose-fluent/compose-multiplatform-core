import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier
import org.jetbrains.kotlin.gradle.plugin.KotlinPlatformType
import org.jetbrains.kotlin.konan.target.Family

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("JetBrainsAndroidXPlugin")
    alias(libs.plugins.kotlinSerialization)
}

def composeWinUiJvmTargetEnabled = providers
        .gradleProperty("composeWinUi.enableJvmTarget")
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def composeWinUiGradlePluginAvailable = JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_22)
def composeWinUiSkikoWinUiVersion = providers
        .gradleProperty("composeWinUi.skikoWinUiVersion")
        .orElse("0.0.0-SNAPSHOT")

def composeWinUiMingwTargetEnabled = providers
        .gradleProperty("composeWinUi.enableMingwTarget")
        .map { it.toBoolean() }
        .orElse(false)
        .get()

androidXMultiplatform {
    redirect("androidx.navigation") {
        androidLibrary {
            compileSdk = 35
            namespace = "org.jetbrains.androidx.navigation.compose"

            androidResources.enable = true
        }
    }
    if (!composeWinUiJvmTargetEnabled) {
        desktop()
    }
    mac()
    ios()
    js()
    wasmJs()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain.dependencies {
            api(project(":navigation:navigation-runtime"))
            api(project(":navigation:navigation-common"))
            if (composeWinUiMingwTargetEnabled) {
                // The navigation projects build mingwX64 from their sources and redirect every
                // other target to the androidx artifact with an empty leaf. The metadata of
                // commonMain sees the source sets a project dependency exposes on all the
                // platforms of commonMain, the JVM one included, where the leaf exposes none,
                // so the API comes from the redirect artifact here. The MinGW configurations
                // substitute it by the project (WinUiMingwDependencies.kt).
                def navigationVersion = project.redirectVersions.get('androidx.navigation')
                compileOnly("androidx.navigation:navigation-runtime:$navigationVersion")
                compileOnly("androidx.navigation:navigation-common:$navigationVersion")
            }
            implementation("androidx.annotation:annotation:1.8.0")
            // The WinUI build compiles against the Compose modules of this build: the MinGW
            // configurations substitute the published ones by the projects anyway, and the
            // metadata of commonMain needs the project structure of what the platforms resolve.
            def compose = { String projectPath, String published ->
                composeWinUiMingwTargetEnabled ? project(projectPath) : published
            }
            api(compose(":compose:runtime:runtime", "org.jetbrains.compose.runtime:runtime:1.10.0"))
            api(compose(":compose:ui:ui", "org.jetbrains.compose.ui:ui:1.10.0"))
            api(compose(":compose:animation:animation", "org.jetbrains.compose.animation:animation:1.10.0"))
            api(compose(":compose:runtime:runtime-saveable", "org.jetbrains.compose.runtime:runtime-saveable:1.10.0"))
            implementation(compose(":compose:animation:animation-core", "org.jetbrains.compose.animation:animation-core:1.10.0"))
            implementation(compose(":compose:foundation:foundation-layout", "org.jetbrains.compose.foundation:foundation-layout:1.10.0"))
            implementation("androidx.collection:collection:1.5.0")
            // The beta artifacts have no published MinGW implementation. Use this release's
            // redirected Lifecycle version for the WinUI native build.
            def lifecycleVersion = composeWinUiMingwTargetEnabled
                    ? project.redirectVersions.get('androidx.lifecycle') : '2.11.0-beta01'
            implementation("org.jetbrains.androidx.lifecycle:lifecycle-common:$lifecycleVersion")
            implementation("org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose:$lifecycleVersion")
            implementation("org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycleVersion")
            implementation("org.jetbrains.androidx.lifecycle:lifecycle-viewmodel:$lifecycleVersion")
            implementation("org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion")
            implementation("androidx.savedstate:savedstate:1.4.0")
            implementation("androidx.savedstate:savedstate-compose:1.4.0")
            implementation(libs.kotlinCoroutinesCore)
            implementation(libs.kotlinSerializationCore)
        }
        commonTest.dependencies {
            implementation(libs.kotlinTest)
            implementation(project(":compose:ui:ui-test"))
        }
        create("nonAndroidMain").dependsOn(commonMain)
        create("nonAndroidTest").dependsOn(commonTest)

        nonAndroidMain.dependencies {
            // TODO: Remove the dependency - https://youtrack.jetbrains.com/issue/CMP-9922
            implementation(project(":compose:ui:ui-backhandler"))
        }

        nonAndroidTest {
            dependsOn(commonTest)
            dependencies {
                implementation(libs.kotlinCoroutinesTest)
                implementation(project(":compose:material:material"))
                implementation(project(":navigation:navigation-testing"))
                implementation(project(":internal-testutils-navigation"))
                implementation(project(":kruth:kruth"))
            }
        }

        jvmMain.dependsOn(nonAndroidMain)
        jvmTest.dependsOn(nonAndroidTest)
        desktopMain.dependsOn(jvmMain)
        desktopTest.dependsOn(jvmTest)

        androidMain.dependencies {
            api("androidx.activity:activity-compose:1.8.0")
            api("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2")
            implementation("androidx.activity:activity:1.8.0")
        }
        androidDeviceTest.dependencies {
            implementation("androidx.activity:activity:1.9.2")
            implementation("androidx.core:core-ktx:1.13.0")
            implementation("androidx.lifecycle:lifecycle-runtime-testing:2.8.2")
            implementation("androidx.lifecycle:lifecycle-runtime:2.8.2")
            implementation("androidx.lifecycle:lifecycle-common:2.8.2")
            implementation("androidx.lifecycle:lifecycle-viewmodel:2.8.2")
            implementation("androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.2")
            implementation("androidx.savedstate:savedstate:1.2.1")
            implementation(project(":navigation:navigation-testing"))
            implementation(libs.testExtJunit)
            implementation(libs.testRunner)
            implementation(libs.junit)
            implementation(libs.truth)
            implementation(project(":internal-testutils-navigation"))

            // Compose test dependencies
            implementation(project(":compose:animation:animation"))
            implementation(project(":compose:animation:animation-core"))
            implementation(project(":compose:foundation:foundation"))
            implementation(project(":compose:runtime:runtime"))
            implementation(project(":compose:runtime:runtime-saveable"))
            implementation(project(":compose:ui:ui"))
            implementation(project(":compose:ui:ui-graphics"))
            implementation(project(":compose:ui:ui-test"))
            implementation(project(":compose:ui:ui-text"))
            implementation(project(":compose:ui:ui-tooling-preview"))
            implementation(project(":compose:ui:ui-unit"))
            implementation(project(":compose:material:material"))
            implementation(project(":compose:test-utils"))
            implementation(project(":compose:ui:ui-test-junit4"))
            implementation(project(":compose:ui:ui-tooling"))
            implementation(project(":internal-testutils-navigation"))
        }

        desktopMain {
            dependsOn(nonAndroidMain)
        }

        desktopTest {
            dependsOn(nonAndroidTest)
            dependencies {
                implementation(libs.skikoCurrentOs)
                implementation(libs.kotlinCoroutinesSwing)
            }
        }

        nonJvmMain {
            dependsOn(nonAndroidMain)
            dependencies {
                // To comply with Klib resolver until https://youtrack.jetbrains.com/issue/KT-61096 is fixed
                implementation("org.jetbrains.androidx.savedstate:savedstate:1.4.0")
                implementation("org.jetbrains.androidx.savedstate:savedstate-compose:1.4.0")
            }
        }

        nonJvmTest {
            dependsOn(nonAndroidTest)
        }

        nativeMain {
            dependsOn(nonJvmMain)
        }

        nativeTest {
            dependsOn(nonJvmTest)
        }

        webMain {
            dependsOn(nonJvmMain)
        }

        webTest {
            dependsOn(nonJvmTest)
        }
    }
}

dependencies {
    lintChecks(project(":navigation:navigation-compose-lint"))
}

androidx {
    name = "Compose Navigation"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2020"
    description = "Compose integration with Navigation"
    samples(project(":navigation:navigation-compose:navigation-compose-samples"))
    addGoldenImageAssets()
}

kotlin {
    if (composeWinUiGradlePluginAvailable && composeWinUiMingwTargetEnabled) {
        mingwX64("winuiMingw")

        sourceSets {
            winuiMingwMain {
                dependsOn(nativeMain)
            }
        }
    }
    if (composeWinUiGradlePluginAvailable && composeWinUiJvmTargetEnabled) {
        jvm("winuiJvm")

        sourceSets {
            winuiJvmMain {
                dependsOn(nonAndroidMain)
                kotlin.srcDir("src/desktopMain/kotlin")
                dependencies {
                // Compile against the WinUI Compose UI that the application runs with. The
                // published one is the desktop variant, whose actuals (Dialog_skikoKt) are not
                // in the WinUI one.
                    implementation(project(":compose:ui:ui"))
                }
            }

            winuiJvmTest {
                dependsOn(nonAndroidTest)
            }
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
    if (task.name.contains("Winui")) {
        task.compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
            freeCompilerArgs.add("-Xjdk-release=25")
        }
    }
}

configurations.configureEach { configuration ->
    def lowerName = configuration.name.toLowerCase(Locale.ROOT)
    if (lowerName.contains("winui")) {
        if (!lowerName.contains("mingw")) {
            configuration.attributes.attribute(
                    org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,
                    25
            )
        }
        configuration.resolutionStrategy.dependencySubstitution {
            substitute(module("org.jetbrains.skiko:skiko"))
                    .using(module("io.github.compose-fluent:skiko-winui:${composeWinUiSkikoWinUiVersion.get()}"))
                    .because("compose-winui JVM uses skiko-winui as the WinUI replacement for the regular Skiko distribution.")
        }
    }
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { task ->
    if (task.name.contains("Winui")) {
        task.enabled = false
    }
}
