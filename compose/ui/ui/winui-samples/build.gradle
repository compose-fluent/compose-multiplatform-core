tasks.named("generateWinRtProjections").configure {
    authoringScannerClasspath.from(configurations.runtimeClasspath)
    authoringScannerClasspath.from(configurations.winRtAuthoringScannerClasspath)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        freeCompilerArgs.add("-opt-in=kotlin.time.ExperimentalTime")
    }
}

tasks.register("runWinUIViewSample", JavaExec) {
    group = "verification"
    description = "Runs the minimal compose-winui WinUI smoke sample."
    dependsOn("classes")
    dependsOn("stageWinRtRuntimeAssets")
    mainClass = "androidx.compose.ui.winui.samples.WinUIViewSampleKt"
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs("--enable-native-access=ALL-UNNAMED")
    systemProperty("compose.winui.sample.autoExit", "true")
}
