import androidx.build.SoftwareType
import androidx.build.PlatformIdentifier
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.plugin.KotlinPlatformType
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    alias(libs.plugins.kotlinSerialization)
}

def composeWinUiJvmTargetEnabled = providers
        .gradleProperty("composeWinUi.enableJvmTarget")
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def composeWinUiGradlePluginAvailable = JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_22)

androidXMultiplatform {
    androidLibrary {
        compileSdk = 36
        namespace = "androidx.navigation3.runtime"
        androidResources.enable = true
    }
    if (!composeWinUiJvmTargetEnabled) {
        desktop()
    }
    mingwX64()
    linux()
    mac()
    ios()
    tvos()
    watchos()
    js()
    wasmJs()

    defaultPlatform(PlatformIdentifier.ANDROID)

    sourceSets {
        commonMain.dependencies {
            api(libs.kotlinSerializationCore)
            api("org.jetbrains.compose.runtime:runtime:1.10.0")
            api("org.jetbrains.compose.runtime:runtime-saveable:1.10.0")
            api("androidx.savedstate:savedstate:1.4.0")
            api("androidx.savedstate:savedstate-compose:1.4.0")
            implementation("androidx.collection:collection:1.5.0")
            implementation("org.jetbrains.androidx.lifecycle:lifecycle-runtime:2.11.0-beta01")
            api("androidx.navigationevent:navigationevent:1.1.1")
        }

        commonTest.dependencies {
            implementation(libs.kotlinTest)
            implementation(libs.kotlinCoroutinesTest)
            implementation(project(":kruth:kruth"))
            implementation(project(":compose:runtime:runtime-test-utils"))
            implementation("androidx.navigationevent:navigationevent-testing:1.1.1")
        }

        androidMain.dependencies {
            implementation("androidx.core:core-ktx:1.1.0")
        }

        androidDeviceTest.dependencies {
            implementation(libs.testRules)
            implementation(libs.testRunner)
            implementation(libs.junit)
            implementation(libs.testExtJunitKtx)
            implementation(libs.truth)
            implementation("androidx.compose.material3:material3:1.3.1")
            implementation(project(":compose:test-utils"))
            implementation("androidx.compose.ui:ui:1.9.5")
            implementation("androidx.compose.ui:ui-test:1.9.5")
            implementation("androidx.compose.ui:ui-test-junit4:1.9.5")
            implementation(project(":navigation3:navigation3-ui"))
            implementation(libs.kotlinSerializationCore)
        }

        create("nonAndroidMain").dependsOn(commonMain)
        desktopMain.dependsOn(nonAndroidMain)
        nativeMain.dependsOn(nonAndroidMain)
        webMain.dependsOn(nonAndroidMain)

        create("nonAndroidTest").dependsOn(commonTest)
        desktopTest.dependsOn(nonAndroidTest)
        nativeTest.dependsOn(nonAndroidTest)
        webTest.dependsOn(nonAndroidTest)
    }
}

kotlin {
    if (composeWinUiGradlePluginAvailable && composeWinUiJvmTargetEnabled) {
        jvm("winuiJvm")

        sourceSets {
            winuiJvmMain {
                dependsOn(nonAndroidMain)
            }

            winuiJvmTest {
                dependsOn(nonAndroidTest)
            }
        }
    }
}

configurations.configureEach { configuration ->
    if (configuration.name.toLowerCase(Locale.ROOT).contains("winui")) {
        configuration.attributes.attribute(
                org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,
                25
        )
    }
}

tasks.withType(KotlinCompile).configureEach { task ->
    if (task.name.contains("Winui")) {
        task.compilerOptions {
            jvmTarget.set(JvmTarget.JVM_25)
            freeCompilerArgs.add("-Xjdk-release=25")
        }
    }
}

androidx {
    name = "Androidx Navigation 3 Runtime"
    type = SoftwareType.PUBLISHED_LIBRARY_ONLY_USED_BY_KOTLIN_CONSUMERS
    inceptionYear = "2024"
    description = "Provides the building blocks for a Compose first Navigation solution that " +
            "easily supports extensions."
    samples(project(":navigation3:navigation3-runtime:navigation3-runtime-samples"))
    addGoldenImageAssets()
}
