import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("org.jetbrains.kotlin.jvm")
    id("JetBrainsAndroidXPlugin")
    id("io.github.composefluent.winrt")
}

dependencies {
    def lifecycleVersion = project.findProperty('artifactRedirection.version.androidx.lifecycle')
    def navigationEventVersion = project.findProperty('artifactRedirection.version.androidx.navigationevent')
    def kotlinWinRtVersion = project.findProperty("kotlinWinRt.version") ?: "0.1.0-SNAPSHOT"
    def composeWinUiSkikoWinUiVersion = providers
            .gradleProperty("composeWinUi.skikoWinUiVersion")
            .orElse("0.0.0-SNAPSHOT")
    implementation(project(":compose:runtime:runtime"))
    implementation(project(":compose:ui:ui"))
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion")
    implementation("androidx.navigationevent:navigationevent-compose:$navigationEventVersion")
    implementation("io.github.compose-fluent:winrt-runtime-jvm:$kotlinWinRtVersion")
    implementation("io.github.compose-fluent:skiko-winui:${composeWinUiSkikoWinUiVersion.get()}")
}

configurations {
    winRtAuthoringScannerClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    winRtAuthoringScannerClasspath(libs.kotlinCompilerEmbeddable)
}

def composeWinUiWindowsAppSdkVersion = providers
        .gradleProperty("composeWinUi.windowsAppSdkVersion")
        .orElse(providers.gradleProperty("kotlinWinRt.samples.windowsAppSdkVersion"))
        .orElse("1.8.260416003")
def composeWinUiWindowsSdkVersion = providers
        .gradleProperty("composeWinUi.windowsSdkVersion")
        .orElse("10.0.26100.0")

winRt {
    application {
        mainClass = "androidx.compose.ui.winui.samples.WinUIViewSampleKt"
    }
    windowsSdk(composeWinUiWindowsSdkVersion.get(), false)
    nugetPackage("Microsoft.WindowsAppSDK", composeWinUiWindowsAppSdkVersion.get())
    type("Windows.Foundation.Uri")
}

def composeWinUiProjectionOwnerFirstClasspath = { runtimeClasspath ->
    // SKIKO-007: JavaExec samples also need compose-ui's generated projection
    // owner before skiko-winui's overlapping projection classes.
    files(
            runtimeClasspath.filter { it.name.startsWith("ui-winuijvm-") },
            runtimeClasspath.filter { !it.name.startsWith("ui-winuijvm-") },
    )
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_25.toString()
    targetCompatibility = JavaVersion.VERSION_25.toString()
    options.release.set(25)
}

tasks.named("generateWinRtProjections").configure {
    authoringScannerClasspath.from(configurations.runtimeClasspath)
    authoringScannerClasspath.from(configurations.winRtAuthoringScannerClasspath)
}

tasks.register("prioritizeComposeWinUiProjectionJarForHost") {
    dependsOn("buildWinRtApplicationHost")
    outputs.upToDateWhen { false }
    doLast {
        def libDirectory = layout.buildDirectory
                .dir("kotlin-winrt/application-host/bin/lib")
                .get()
                .asFile
        delete(fileTree(libDirectory) {
            include("00-ui-winuijvm-*.jar")
        })

        def uiWinUiJars = fileTree(libDirectory) {
            include("ui-winuijvm-*.jar")
        }.files
        if (uiWinUiJars.size() != 1) {
            throw new GradleException("Expected exactly one ui-winuijvm jar, found ${uiWinUiJars.size()}.")
        }

        // SKIKO-007: skiko-winui currently bundles overlapping WinRT/WinUI
        // projections. The native host builds its classpath from staged lib
        // names, so load compose-ui's projection owner before skiko-winui.
        def uiWinUiJar = uiWinUiJars.first()
        copy {
            from(uiWinUiJar)
            into(libDirectory)
            rename { "00-${uiWinUiJar.name}" }
        }
    }
}

tasks.named("runWinRtApplicationHost").configure {
    dependsOn("prioritizeComposeWinUiProjectionJarForHost")
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_25)
        freeCompilerArgs.add("-Xjdk-release=25")
        freeCompilerArgs.add("-opt-in=kotlin.time.ExperimentalTime")
    }
}

tasks.register("runWinUIViewSample", JavaExec) {
    group = "verification"
    description = "Runs the minimal compose-winui WinUI smoke sample."
    dependsOn("classes")
    dependsOn("stageWinRtRuntimeAssets")
    dependsOn("buildWinRtAuthoringHost")
    mainClass = "androidx.compose.ui.winui.samples.WinUIViewSampleJavaExecKt"
    classpath = composeWinUiProjectionOwnerFirstClasspath(sourceSets.main.runtimeClasspath)
    jvmArgs("--enable-native-access=ALL-UNNAMED")
    systemProperty("compose.winui.sample.autoExit", "true")
}

tasks.register("runWinUISkikoSample", JavaExec) {
    group = "verification"
    description = "Runs the compose-winui Skiko render smoke sample."
    dependsOn("classes")
    dependsOn("stageWinRtRuntimeAssets")
    dependsOn("buildWinRtAuthoringHost")
    mainClass = "androidx.compose.ui.winui.samples.WinUIViewSampleJavaExecKt"
    classpath = composeWinUiProjectionOwnerFirstClasspath(sourceSets.main.runtimeClasspath)
    jvmArgs("--enable-native-access=ALL-UNNAMED")
    systemProperty("compose.winui.sample.autoExit", "true")
    args("skiko")
}
