tasks.withType(KotlinCompile).configureEach { task ->
    if (task.name != "compileAndroidMain") return
    task.compilerOptions {
        it.freeCompilerArgs.addAll("-Xlambdas=class")
    }
}

if (composeWinUiGradlePluginAvailable) {
    configurations.configureEach { configuration ->
        def lowerName = configuration.name.toLowerCase(Locale.ROOT)
        if (lowerName.contains("winui")) {
            configuration.attributes.attribute(
                    org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,
                    25
            )
            configuration.resolutionStrategy.eachDependency { details ->
                if (details.requested.group == "org.jetbrains.skiko" && details.requested.name == "skiko") {
                    details.useVersion(composeWinUiSkikoVersion.get())
                    details.because("compose-winui consumes the skiko-winui snapshot built against this Skiko snapshot.")
                }
            }
        }
    }

    def generatedWinRtSources = layout.buildDirectory.dir("generated/kotlin-winrt/src/main/kotlin")
    def generatedWinRtAuthoringSources = layout.buildDirectory.dir("generated/kotlin-winrt-authoring/src/main/kotlin")
    def generatedWinRtSourceDirectories = [
            generatedWinRtSources,
            generatedWinRtAuthoringSources,
    ]
    tasks.withType(KotlinCompile).configureEach { task ->
        if (!task.name.contains("Winui")) {
            task.exclude { details ->
                def filePath = details.file.toPath().toAbsolutePath().normalize()
                generatedWinRtSourceDirectories.any { sourceDirectory ->
                    filePath.startsWith(
                            sourceDirectory.get().asFile.toPath().toAbsolutePath().normalize()
                    )
                }
            }
            return
        }
        // WinUI sits below skikoMain in the source-set graph, but it must keep
        // WinUI/XAML actuals where skikoMain uses generic or Win32-backed
        // implementations. Start with a WinUI-first bridge and selectively
        // allow skikoMain scene/rendering sources as skiko-winui lands.
        if (task.name == "compileKotlinWinuiJvm") {
            task.setSource(project.files(
                    "src/commonMain/kotlin",
                    "src/jvmAndAndroidMain/kotlin",
                    "src/skikoMain/kotlin/androidx/compose/ui/skiko/RecordDrawRectRenderDecorator.skiko.kt",
                    "src/winuiMain/kotlin",
                    "src/winuiJvmMain/kotlin",
                    layout.buildDirectory.dir("generated/kotlin-winrt/src/main/kotlin"),
                    generatedWinRtAuthoringSources,
            ))
        }
        task.dependsOn("generateWinRtProjections")
        task.compilerOptions {
            it.jvmTarget.set(JvmTarget.JVM_25)
            it.freeCompilerArgs.add("-Xjdk-release=25")
            it.freeCompilerArgs.add("-opt-in=kotlin.time.ExperimentalTime")
        }
    }

    tasks.named("generateWinRtProjections").configure {
        sourceRoots.setFrom(project.file("src/winuiMain/kotlin"))
        authoringScannerClasspath.from(configurations.winRtAuthoringScannerClasspath)
    }

    tasks.matching { it.name == "validateCompileKotlinWinuiJvmWinRtAuthoredCandidates" }.configureEach {
        doFirst {
            def scannerDir = scannerAuthoringTypeDetails.singleFile
            def compilerDir = compilerAuthoringTypeDetails.singleFile
            if (!scannerDir.isDirectory() || !compilerDir.isDirectory()) return

            scannerDir.eachFileRecurse(groovy.io.FileType.FILES) { scannerFile ->
                if (!scannerFile.name.endsWith("_TypeDetails.kt")) return

                def relativePath = scannerDir.toPath().relativize(scannerFile.toPath()).toString()
                def compilerFile = new File(compilerDir, relativePath)
                if (!compilerFile.isFile()) return

                def scannerText = scannerFile.getText("UTF-8")
                def compilerText = compilerFile.getText("UTF-8")
                if (scannerText == compilerText) return

                // KWINRT-025: current snapshot scanner and compiler generators can
                // emit semantically identical TypeDetails with different wrapping.
                if (scannerText.replaceAll("\\s+", "") == compilerText.replaceAll("\\s+", "")) {
                    compilerFile.setText(scannerText, "UTF-8")
                }
            }
        }
    }
}

