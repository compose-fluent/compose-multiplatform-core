import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id("AndroidXPlugin")
    id("AndroidXComposePlugin")
    id("org.jetbrains.kotlin.jvm")
    id("JetBrainsAndroidXPlugin")
    id("io.github.composefluent.winrt")
}

dependencies {
    def lifecycleVersion = project.findProperty('artifactRedirection.version.androidx.lifecycle')
    def navigationEventVersion = project.findProperty('artifactRedirection.version.androidx.navigationevent')
    def kotlinWinRtVersion = project.findProperty("kotlinWinRt.version") ?: "0.1.0-SNAPSHOT"
    def composeWinUiSkikoWinUiVersion = providers
            .gradleProperty("composeWinUi.skikoWinUiVersion")
            .orElse("0.0.0-SNAPSHOT")
    implementation(project(":compose:runtime:runtime"))
    implementation(project(":compose:ui:ui"))
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion")
    implementation("androidx.navigationevent:navigationevent-compose:$navigationEventVersion")
    implementation("io.github.compose-fluent:winrt-runtime-jvm:$kotlinWinRtVersion")
    implementation("io.github.compose-fluent:skiko-winui:${composeWinUiSkikoWinUiVersion.get()}")
}

configurations {
    winRtAuthoringScannerClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    winRtAuthoringScannerClasspath(libs.kotlinCompilerEmbeddable)
}

def composeWinUiWindowsAppSdkVersion = providers
        .gradleProperty("composeWinUi.windowsAppSdkVersion")
        .orElse(providers.gradleProperty("kotlinWinRt.samples.windowsAppSdkVersion"))
        .orElse("2.1.3")
def winRtApplicationHostExecutable = layout.buildDirectory.file("kotlin-winrt/application-host/bin/${project.name}.exe")
def winRtApplicationHostBin = layout.buildDirectory.dir("kotlin-winrt/application-host/bin")

winRt {
    application {
        mainClass = "androidx.compose.ui.winui.samples.WinUIViewSampleKt"
    }
    nugetPackage("Microsoft.WindowsAppSDK", composeWinUiWindowsAppSdkVersion.get())
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_25.toString()
    targetCompatibility = JavaVersion.VERSION_25.toString()
    options.release.set(25)
}

tasks.named("generateWinRtProjections").configure {
    authoringScannerClasspath.from(configurations.runtimeClasspath)
    authoringScannerClasspath.from(configurations.winRtAuthoringScannerClasspath)
}

tasks.named("buildWinRtApplicationHost").configure {
    doLast {
        def hostBin = winRtApplicationHostBin.get().asFile
        def libDir = new File(hostBin, "lib")
        def uiWinUiJar = libDir.listFiles()?.find { file ->
            file.name ==~ /ui-winuijvm-.*\.jar/
        }
        if (uiWinUiJar == null) {
            throw new GradleException("WinUI sample application host did not include ui-winuijvm.")
        }
        // KWINRT-041: keep this module's projection classes ahead of skiko-winui
        // until dependency-owned WinRT type shapes are merged coherently.
        copy {
            from(uiWinUiJar)
            into(hostBin)
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_25)
        freeCompilerArgs.add("-Xjdk-release=25")
        freeCompilerArgs.add("-opt-in=kotlin.time.ExperimentalTime")
    }
}

def registerWinUISampleTask = { String taskName, String descriptionText, String mode = null, Closure extraConfig = null ->
    tasks.register(taskName, Exec) {
        group = "verification"
        description = descriptionText
        dependsOn("buildWinRtApplicationHost")
        executable = winRtApplicationHostExecutable.get().asFile.absolutePath
        if (mode != null) {
            args(mode)
        }
        def jvmOptions = [
                "-Dcompose.winui.sample.autoExit=true",
                "-Dcompose.winui.textInput.coreText.enabled=true",
        ]
        if (mode != null) {
            jvmOptions.add("-Dcompose.winui.sample.mode=${mode}")
        }
        if (extraConfig != null) {
            extraConfig.delegate = jvmOptions
            extraConfig(jvmOptions)
        }
        doFirst {
            environment("KOTLIN_WINRT_JVM_OPTIONS", jvmOptions.join(";"))
            def hostFiles = winRtApplicationHostBin.get().asFileTree.files
            def classpathNames = hostFiles.findAll { it.name.endsWith(".jar") }.collect { it.name }
            if (!classpathNames.any { it.contains("skiko-winui") }) {
                throw new GradleException("WinUI sample application host did not include skiko-winui.")
            }
            if (classpathNames.any { it.contains("skiko-awt-runtime") }) {
                throw new GradleException("WinUI sample application host must not include Skiko AWT runtime artifacts: $classpathNames")
            }
        }
    }
}

registerWinUISampleTask(
    "runWinUIViewSample",
    "Runs the minimal compose-winui WinUI smoke sample."
)
